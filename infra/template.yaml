AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Smart Daily Meal Planner Assistant — Lambda + Bedrock + S3

Parameters:
  AccountId:
    Type: String
    Default: !Sub "${AWS::AccountId}"

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
        AWS_LWA_INVOKE_MODE: response_stream
        PORT: "8080"
    Layers:
      - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"

Resources:

  # ---------------------------------------------------------------
  # IAM Role shared by all Lambda functions
  # ---------------------------------------------------------------
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SmartMealPlannerBedrockRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Global cross-region inference profile
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0"
                  # Regional foundation model (ap-southeast-1 + cross-region destinations)
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0"
                  # Wildcard foundation-model ARN variant used by some SDKs
                  - "arn:aws:bedrock:::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0"

  # ---------------------------------------------------------------
  # Meal Plan Lambda — streaming Flask app
  # ---------------------------------------------------------------
  MealPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smart-meal-planner-meal-plan
      CodeUri: ../backend/meal_plan/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ---------------------------------------------------------------
  # Meal Planning Chat Lambda — streaming Flask app
  # ---------------------------------------------------------------
  MealPlanningChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smart-meal-planner-chat
      CodeUri: ../backend/meal_planning_chat/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ---------------------------------------------------------------
  # S3 bucket — static website hosting
  # ---------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "smart-meal-planner-frontend-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

# ---------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------
Outputs:
  MealPlanUrl:
    Description: Function URL for the Meal Plan Lambda
    Value: !GetAtt MealPlanFunctionUrl.FunctionUrl

  MealPlanningChatUrl:
    Description: Function URL for the Meal Planning Chat Lambda
    Value: !GetAtt MealPlanningChatFunctionUrl.FunctionUrl

  WebsiteUrl:
    Description: S3 static website URL
    Value: !GetAtt FrontendBucket.WebsiteURL

  BucketName:
    Description: Frontend S3 bucket name
    Value: !Ref FrontendBucket
