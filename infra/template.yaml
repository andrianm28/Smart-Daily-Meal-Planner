AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Smart Daily Meal Planner Assistant — Lambda + Bedrock + S3


Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
        PORT: "8080"
    Layers:
      - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"

Resources:

  # ---------------------------------------------------------------
  # IAM Role shared by all Lambda functions
  # ---------------------------------------------------------------
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: SmartMealPlannerBedrockRole
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  # Global cross-region inference profile
                  - !Sub "arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0"
                  # Regional foundation model (ap-southeast-1 + cross-region destinations)
                  - "arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0"
                  # Wildcard foundation-model ARN variant used by some SDKs
                  - "arn:aws:bedrock:::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0"

  # ---------------------------------------------------------------
  # Meal Plan Lambda — streaming Flask app
  # ---------------------------------------------------------------
  MealPlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smart-meal-planner-meal-plan
      CodeUri: ../backend/meal_plan/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn

  MealPlanFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MealPlanFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MealPlanApi}/*/*"

  MealPlanApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: smart-meal-planner-meal-plan-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  MealPlanIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref MealPlanApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MealPlanFunction.Arn
      PayloadFormatVersion: "2.0"

  MealPlanRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MealPlanApi
      RouteKey: "POST /"
      Target: !Sub "integrations/${MealPlanIntegration}"

  MealPlanStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref MealPlanApi
      StageName: "$default"
      AutoDeploy: true

  # ---------------------------------------------------------------
  # Meal Planning Chat Lambda — streaming Flask app
  # ---------------------------------------------------------------
  MealPlanningChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: smart-meal-planner-chat
      CodeUri: ../backend/meal_planning_chat/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn

  MealPlanningChatFunctionPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MealPlanningChatFunction.Arn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${MealPlanningChatApi}/*/*"

  MealPlanningChatApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: smart-meal-planner-chat-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - POST
          - OPTIONS
        AllowHeaders:
          - Content-Type

  MealPlanningChatIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref MealPlanningChatApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt MealPlanningChatFunction.Arn
      PayloadFormatVersion: "2.0"

  MealPlanningChatRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref MealPlanningChatApi
      RouteKey: "POST /"
      Target: !Sub "integrations/${MealPlanningChatIntegration}"

  MealPlanningChatStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref MealPlanningChatApi
      StageName: "$default"
      AutoDeploy: true

  # ---------------------------------------------------------------
  # S3 bucket — static website hosting
  # ---------------------------------------------------------------
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "smart-meal-planner-frontend-${AWS::AccountId}"
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:aws:s3:::${FrontendBucket}/*"

# ---------------------------------------------------------------
# Outputs
# ---------------------------------------------------------------
Outputs:
  MealPlanUrl:
    Description: API Gateway URL for the Meal Plan Lambda
    Value: !Sub "https://${MealPlanApi}.execute-api.${AWS::Region}.amazonaws.com/"

  MealPlanningChatUrl:
    Description: API Gateway URL for the Meal Planning Chat Lambda
    Value: !Sub "https://${MealPlanningChatApi}.execute-api.${AWS::Region}.amazonaws.com/"

  WebsiteUrl:
    Description: S3 static website URL
    Value: !GetAtt FrontendBucket.WebsiteURL

  BucketName:
    Description: Frontend S3 bucket name
    Value: !Ref FrontendBucket
