name: Deploy Smart Daily Meal Planner

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to AWS
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ─────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Configure AWS credentials ────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ap-southeast-5

      # ── 3. Set up Python ─────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── 4. Set up AWS SAM CLI ────────────────────────────────────
      - name: Set up AWS SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      # ── 5. SAM Build ─────────────────────────────────────────────
      - name: SAM Build
        run: sam build --template infra/template.yaml

      # ── 6. SAM Deploy ────────────────────────────────────────────
      - name: SAM Deploy
        run: |
          sam deploy \
            --stack-name smart-daily-meal-planner-assistant \
            --s3-bucket ${{ secrets.SAM_DEPLOY_BUCKET }} \
            --s3-prefix smart-daily-meal-planner \
            --s3-region ap-southeast-5 \
            --capabilities CAPABILITY_IAM CAPABILITY_NAMED_IAM \
            --region ap-southeast-5 \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset

      # ── 7. Read CloudFormation outputs ───────────────────────────
      - name: Read stack outputs
        id: cfn
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name smart-daily-meal-planner-assistant \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }

          MEAL_PLAN_URL=$(get_output MealPlanUrl)
          CHAT_URL=$(get_output MealPlanningChatUrl)
          BUCKET=$(get_output BucketName)
          WEBSITE=$(get_output WebsiteUrl)

          echo "meal_plan_url=$MEAL_PLAN_URL"  >> "$GITHUB_OUTPUT"
          echo "chat_url=$CHAT_URL"            >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET"               >> "$GITHUB_OUTPUT"
          echo "website=$WEBSITE"             >> "$GITHUB_OUTPUT"

          echo "=== Stack Outputs ==="
          echo "Meal Plan URL   : $MEAL_PLAN_URL"
          echo "Chat URL        : $CHAT_URL"
          echo "S3 Bucket       : $BUCKET"
          echo "Website URL     : $WEBSITE"

      # ── 8. Inject Lambda URLs into frontend ──────────────────────
      - name: Inject URLs into frontend/index.html
        run: |
          # Work on a copy so the repo working tree stays clean
          cp frontend/index.html frontend/index.html.bak

          URL=${{ steps.cfn.outputs.meal_plan_url }}
          sed -i "s|__URL_MEAL_PLAN__|$URL|g" frontend/index.html

          URL=${{ steps.cfn.outputs.chat_url }}
          sed -i "s|__URL_MEAL_PLANNING_CHAT__|$URL|g" frontend/index.html

      # ── 9. Sync frontend to S3 ───────────────────────────────────
      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/ s3://${{ steps.cfn.outputs.bucket }} \
            --cache-control no-cache \
            --delete

      # ── 10. Restore index.html (keep repo clean) ─────────────────
      - name: Restore frontend/index.html
        if: always()
        run: |
          if [ -f frontend/index.html.bak ]; then
            mv frontend/index.html.bak frontend/index.html
          fi

      # ── 11. Print live URL ───────────────────────────────────────
      - name: Deployment complete
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════╗"
          echo "║  ✅  Smart Daily Meal Planner is live!               ║"
          echo "╠══════════════════════════════════════════════════════╣"
          echo "║  🌐  ${{ steps.cfn.outputs.website }}"
          echo "╚══════════════════════════════════════════════════════╝"
          echo ""
